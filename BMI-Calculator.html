<!DOCTYPE html>
<html lang="en">
<head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>BMI Calculator - ToolPot</title>
<style>:root{--p:#10b981;--bg:#f0fdf4;--card:#fff}*{margin:0;padding:0;box-sizing:border-box;font-family:'Segoe UI',system-ui,sans-serif}body{background:linear-gradient(135deg,var(--bg),#dcfce7);min-height:100vh;padding:40px 20px;display:flex;align-items:center;justify-content:center} .card{background:var(--card);padding:40px;border-radius:24px;box-shadow:0 20px 50px rgba(16,185,129,.15);max-width:420px;width:100%} h1{font-size:1.8rem;margin-bottom:24px;background:linear-gradient(90deg,#10b981,#34d399);-webkit-background-clip:text;background-clip:text;color:transparent} label{display:block;margin:8px 0 4px;font-weight:600;color:#374151} input{width:100%;padding:12px 14px;border:2px solid #e5e7eb;border-radius:12px;font-size:1rem;margin-bottom:16px;outline:none;transition:border-color .2s} input:focus{border-color:#10b981} .btn{width:100%;padding:14px;background:linear-gradient(90deg,#10b981,#34d399);color:#fff;border:none;border-radius:14px;font-size:1.1rem;font-weight:700;cursor:pointer;box-shadow:0 8px 25px rgba(16,185,129,.3);transition:transform .15s} .btn:hover{transform:translateY(-2px)} .result{margin-top:24px;padding:20px;border-radius:16px;background:#ecfdf5;font-size:1.3rem;font-weight:700;text-align:center;color:#065f46}</style></head>
<body>
<div class="card">
<h1>BMI Calculator</h1>
<label>Weight (kg)</label><input id="w" type="number" value="70">
<label>Height (cm)</label><input id="h" type="number" value="170">
<button class="btn" onclick="calc()">Calculate BMI</button>
<div class="result" id="res">BMI: 24.2</div>
</div>
<script>function calc(){const w=+document.getElementById('w').value;const h=+document.getElementById('h').value;document.getElementById('res').textContent='BMI: '+(w/((h/100)**2)).toFixed(1);}</script>
</body>
</html>
