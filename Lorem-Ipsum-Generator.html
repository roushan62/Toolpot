<!DOCTYPE html>
<html lang="en">
<head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>Lorem Ipsum Generator - ToolPot</title>
<style>:root{--p:#ec4899;--bg:#fdf2f8;--card:#fff}*{margin:0;padding:0;box-sizing:border-box;font-family:'Segoe UI',system-ui,sans-serif}body{background:linear-gradient(135deg,var(--bg),#fce7f3);min-height:100vh;padding:40px 20px;display:flex;align-items:center;justify-content:center} .card{background:var(--card);padding:40px;border-radius:24px;box-shadow:0 20px 50px rgba(236,72,153,.12);max-width:700px;width:100%} h1{font-size:1.9rem;margin-bottom:8px;background:linear-gradient(90deg,#ec4899,#f43f5e);-webkit-background-clip:text;background-clip:text;color:transparent} .subtitle{color:#6b7280;margin-bottom:24px} textarea{width:100%;min-height:200px;padding:16px;border:2px solid #fbcfe8;border-radius:14px;font-size:1rem;outline:none;background:#fff;resize:vertical} .btn{margin-top:20px;padding:14px 32px;background:linear-gradient(90deg,#ec4899,#f43f5e);color:#fff;border:none;border-radius:50px;font-size:1.1rem;cursor:pointer;box-shadow:0 8px 25px rgba(236,72,153,.3);transition:transform .15s} .btn:hover{transform:translateY(-2px)}</style></head>
<body>
<div class="card">
<h1>Lorem Ipsum Generator</h1>
<p class="subtitle">Generate placeholder text for designs and layouts instantly.</p>
<textarea id="txt" readonly>Loading...</textarea>
<button class="btn" onclick="generate()">Generate New Text</button>
</div>
<script>function generate(){const words=["lorem","ipsum","dolor","sit","amet","consectetur","adipiscing","elit","sed","do","eiusmod","tempor","incididunt","ut","labore","et","dolore","magna","aliqua"];let t='';for(let i=0;i<60;i++)t+=words[Math.floor(Math.random()*words.length)]+' ';document.getElementById('txt').value=t.trim();}generate();</script>
</body>
</html>
