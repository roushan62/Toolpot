<!DOCTYPE html>
<html lang="en">
<head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>QR Code Generator - ToolPot</title>
<style>:root{--p:#f59e0b;--bg:#fffbeb;--card:#fff}*{margin:0;padding:0;box-sizing:border-box;font-family:'Segoe UI',system-ui,sans-serif}body{background:linear-gradient(135deg,var(--bg),#fef3c7);min-height:100vh;padding:40px 20px;display:flex;align-items:center;justify-content:center} .card{background:var(--card);padding:40px;border-radius:24px;box-shadow:0 20px 50px rgba(245,158,11,.15);max-width:460px;width:100%;text-align:center} h1{font-size:1.9rem;margin-bottom:8px;background:linear-gradient(90deg,#f59e0b,#f97316);-webkit-background-clip:text;background-clip:text;color:transparent} .subtitle{color:#6b7280;margin-bottom:24px} input{width:100%;padding:14px;border:2px solid #fde68a;border-radius:14px;font-size:1rem;margin-bottom:20px;outline:none} input:focus{border-color:#f59e0b} .btn{padding:14px 32px;background:linear-gradient(90deg,#f59e0b,#f97316);color:#fff;border:none;border-radius:50px;font-size:1.1rem;cursor:pointer;box-shadow:0 8px 25px rgba(245,158,11,.35);transition:transform .15s} .btn:hover{transform:translateY(-2px)} #qrcode{margin-top:24px;display:flex;justify-content:center}</style>
<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
</head>
<body>
<div class="card">
<h1>QR Code Generator</h1>
<p class="subtitle">Enter any text or URL to generate a QR code instantly.</p>
<input id="qrtext" value="https://toolpot.com" oninput="make()">
<button class="btn" onclick="make()">Generate QR</button>
<div id="qrcode"></div>
</div>
<script>function make(){document.getElementById('qrcode').innerHTML='';new QRCode(document.getElementById('qrcode'),{text:document.getElementById('qrtext').value,width:200,height:200});}</script>
</body>
</html>
