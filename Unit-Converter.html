<!DOCTYPE html>
<html lang="en">
<head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>Unit Converter - ToolPot</title>
<style>:root{--p:#6366f1;--bg:#eef2ff;--card:#fff}*{margin:0;padding:0;box-sizing:border-box;font-family:'Segoe UI',system-ui,sans-serif}body{background:linear-gradient(135deg,var(--bg),#ddd6fe);min-height:100vh;padding:40px 20px;display:flex;align-items:center;justify-content:center} .card{background:var(--card);padding:40px;border-radius:24px;box-shadow:0 20px 50px rgba(99,102,241,.12);max-width:500px;width:100%} h1{font-size:1.9rem;margin-bottom:8px;background:linear-gradient(90deg,#6366f1,#a855f7);-webkit-background-clip:text;background-clip:text;color:transparent} .subtitle{color:#6b7280;margin-bottom:24px} select,input{width:100%;padding:12px 14px;border:2px solid #e0e7ff;border-radius:12px;font-size:1rem;margin-bottom:16px;outline:none;background:#fff} .btn{width:100%;padding:14px;background:linear-gradient(90deg,#6366f1,#a855f7);color:#fff;border:none;border-radius:14px;font-size:1.1rem;font-weight:700;cursor:pointer;box-shadow:0 8px 25px rgba(99,102,241,.3);transition:transform .15s} .btn:hover{transform:translateY(-2px)} .result{margin-top:20px;padding:18px;border-radius:14px;background:#eef2ff;font-size:1.2rem;font-weight:700;color:#4338ca;text-align:center}</style></head>
<body>
<div class="card">
<h1>Unit Converter</h1>
<p class="subtitle">Convert between length, weight, and temperature instantly.</p>
<select id="unit"><option>Length (m → ft)</option><option>Weight (kg → lb)</option><option>Temperature (°C → °F)</option></select>
<input id="val" type="number" value="10" oninput="convert()">
<button class="btn" onclick="convert()">Convert</button>
<div class="result" id="res">32.81 ft</div>
</div>
<script>function convert(){const v=+document.getElementById('val').value;const u=document.getElementById('unit').value;let r='';if(u.includes('Length'))r=(v*3.28084).toFixed(2)+' ft';else if(u.includes('Weight'))r=(v*2.20462).toFixed(2)+' lb';else r=(v*9/5+32).toFixed(2)+' °F';document.getElementById('res').textContent=r;}</script>
</body>
</html>
